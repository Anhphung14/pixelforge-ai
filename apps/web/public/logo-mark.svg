<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Black Gradients -->
    <linearGradient id="pf-dark-base" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="40%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="pf-dark-facet" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a354d" />
      <stop offset="50%" stop-color="#131926" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Electric / Neon Blue Gradients -->
    <linearGradient id="pf-blue-core" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0080ff" />
      <stop offset="80%" stop-color="#004cd6" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>

    <linearGradient id="pf-cyan-glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="pf-metal-rim" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.7" />
    </linearGradient>

    <filter id="pf-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Obsidian Hex-Shield Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#pf-dark-base)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Rim lighting border -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="22.5" fill="none" stroke="url(#pf-metal-rim)" stroke-width="1" stroke-opacity="0.6" />

  <!-- 'P' Pillar & Left vertical stem -->
  <path d="M 22 24 L 37 24 L 37 76 L 22 76 Z" fill="url(#pf-dark-facet)" stroke="#0080ff" stroke-width="1" stroke-opacity="0.7" />

  <!-- Left Stem Specular Accent Line -->
  <line x1="24" y1="26" x2="24" y2="74" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- 'P' Loop Outer Structure -->
  <path d="M 37 24 L 58 24 C 67 24 73 30 73 38 C 73 46 67 52 58 52 L 37 52 Z" fill="url(#pf-dark-facet)" stroke="url(#pf-blue-core)" stroke-width="1.5" />

  <!-- 'P' Loop Inner Cutout -->
  <path d="M 37 34 L 54 34 C 57 34 60 36 60 38 C 60 40 57 42 54 42 L 37 42 Z" fill="#060913" stroke="#00d2ff" stroke-width="1.2" />

  <!-- 'F' Dynamic Forge Blades / Wings -->
  <path d="M 52 24 L 78 24 L 70 34 L 48 34 Z" fill="url(#pf-cyan-glow)" filter="url(#pf-neon-glow)" opacity="0.95" />
  <path d="M 46 44 L 75 44 L 66 54 L 40 54 Z" fill="url(#pf-blue-core)" stroke="#38bdf8" stroke-width="1" />
  <path d="M 44 60 L 68 60 L 59 70 L 40 70 Z" fill="url(#pf-cyan-glow)" opacity="0.9" />

  <!-- Precision Pixel Node in Bottom-Right -->
  <rect x="72" y="62" width="8" height="8" rx="2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
</svg>
