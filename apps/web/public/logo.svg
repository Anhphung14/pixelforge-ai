<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="full-dark-base" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="40%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="full-blue-core" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0080ff" />
      <stop offset="80%" stop-color="#004cd6" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>

    <linearGradient id="full-cyan-glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="full-metal-rim" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="forge-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="full-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brandmark Group at x=10, y=10, size=80 -->
  <g transform="translate(10, 10) scale(0.8)">
    <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#full-dark-base)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="5.5" y="5.5" width="89" height="89" rx="22.5" fill="none" stroke="url(#full-metal-rim)" stroke-width="1" stroke-opacity="0.6" />

    <path d="M 22 24 L 37 24 L 37 76 L 22 76 Z" fill="#131926" stroke="#0080ff" stroke-width="1" stroke-opacity="0.7" />
    <line x1="24" y1="26" x2="24" y2="74" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

    <path d="M 37 24 L 58 24 C 67 24 73 30 73 38 C 73 46 67 52 58 52 L 37 52 Z" fill="#131926" stroke="url(#full-blue-core)" stroke-width="1.5" />
    <path d="M 37 34 L 54 34 C 57 34 60 36 60 38 C 60 40 57 42 54 42 L 37 42 Z" fill="#060913" stroke="#00d2ff" stroke-width="1.2" />

    <path d="M 52 24 L 78 24 L 70 34 L 48 34 Z" fill="url(#full-cyan-glow)" filter="url(#full-glow)" opacity="0.95" />
    <path d="M 46 44 L 75 44 L 66 54 L 40 54 Z" fill="url(#full-blue-core)" stroke="#38bdf8" stroke-width="1" />
    <path d="M 44 60 L 68 60 L 59 70 L 40 70 Z" fill="url(#full-cyan-glow)" opacity="0.9" />

    <rect x="72" y="62" width="8" height="8" rx="2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
  </g>

  <!-- Typographic Wordmark -->
  <!-- PIXEL -->
  <text x="105" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.02em">PIXEL</text>
  <!-- FORGE -->
  <text x="195" y="52" fill="url(#forge-text-gradient)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.02em">FORGE</text>

  <!-- AI Badge -->
  <rect x="306" y="32" width="30" height="22" rx="6" fill="#040914" stroke="#00d2ff" stroke-width="1.2" />
  <text x="313" y="47" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" letter-spacing="0.05em">AI</text>

  <!-- Subtitle -->
  <text x="106" y="70" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="0.25em">IMAGE INTELLIGENCE STUDIO</text>
</svg>
